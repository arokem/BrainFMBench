name: score

on:
  push:
    paths: ["models/**", "labels/**", "eval/**", "scripts/score_all.py"]
  pull_request:
    paths: ["models/**"]
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn scipy pyyaml pyarrow
      - name: Score all models
        run: |
          for d in models/*/; do
            echo "=== $d ==="
            python scripts/score_all.py "$d"
          done
