name: score-demo

on:
  push:
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn scipy pyarrow
      - name: Make synthetic submission
        run: python scripts/make_synth.py
      - name: Score it
        run: |
          python eval/scorer.py --features synth_features.parquet \
                                --labels synth_labels.csv \
                                --dataset NKI --task sex
