name: test-cluster-ssh

# manual trigger only
on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key + config
        run: |
          mkdir -p ~/.ssh
          # materialize the private key from the secret
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/openmribench_ci
          chmod 600 ~/.ssh/openmribench_ci
          # install the committed ssh config
          cp ssh/config ~/.ssh/config
          chmod 600 ~/.ssh/config
          # pre-trust the jump server's host key (avoids interactive prompt)
          ssh-keyscan -H 206.12.96.142 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test connection through jump server to rorqual
        run: |
          echo "Attempting: runner -> jumpserver -> robot.rorqual -> squeue"
          ssh robot-rorqual 'echo "CONNECTED as $(whoami) on $(hostname)"; squeue -u arelbaha'
