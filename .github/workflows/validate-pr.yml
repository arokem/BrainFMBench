name: validate-pr

on:
  pull_request:
    paths:
      - "models/**"
      - "example-submission/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml numpy nibabel

      - name: Validate submission metadata (yaml schema)
        run: python scripts/validate_submission.py

      - name: Validate extract.py (interface + runs on synthetic volume)
        run: python scripts/validate_extract.py
